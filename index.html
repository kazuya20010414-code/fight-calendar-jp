<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight Calendar JP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --canvas: #f2ede3;
    --canvas-2: #e8e0d0;
    --line: #d8cfba;
    --ink: #1c1a16;
    --ink-dim: #6f6a5c;
    --surface: #ffffff;
    --accent: #c8791a;
    --accent-ink: #2a1a05;
    --ufc: #c22626;
    --rizin: #b8860b;
    --deep: #1f5fa8;
    --one: #147a52;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #15141a;
      --canvas-2: #1c1b22;
      --line: #33313c;
      --ink: #ede8dc;
      --ink-dim: #9a9488;
      --surface: #1e1d24;
      --accent: #e0983c;
      --accent-ink: #1c1206;
      --ufc: #e2554f;
      --rizin: #d9a83b;
      --deep: #4f8fd6;
      --one: #35a877;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #15141a;
    --canvas-2: #1c1b22;
    --line: #33313c;
    --ink: #ede8dc;
    --ink-dim: #9a9488;
    --surface: #1e1d24;
    --accent: #e0983c;
    --accent-ink: #1c1206;
    --ufc: #e2554f;
    --rizin: #d9a83b;
    --deep: #4f8fd6;
    --one: #35a877;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--canvas);
    color: var(--ink);
    font-family: "IBM Plex Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 64px; }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 20px;
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 3px solid var(--ink);
  }

  .masthead h1 {
    font-family: "Oswald", "IBM Plex Sans JP", sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    text-wrap: balance;
  }

  .masthead .sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border-radius: 3px;
    border: 1.5px solid var(--line);
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    background: var(--surface);
    user-select: none;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .chip .sw { width: 9px; height: 9px; border-radius: 1px; background: var(--dot); }
  .chip.active { color: var(--ink); border-color: var(--dot); }
  .chip:not(.active) { opacity: 0.55; }

  .view-toggle { display: flex; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .view-toggle button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    padding: 8px 16px;
    background: var(--surface);
    color: var(--ink);
    border: none;
    cursor: pointer;
  }
  .view-toggle button.active { background: var(--ink); color: var(--canvas); }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin-bottom: 14px;
  }
  .cal-nav button {
    width: 32px; height: 32px;
    border-radius: 3px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    font-size: 1rem;
  }
  .cal-nav h2 {
    font-family: "Oswald", sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.03em;
    margin: 0;
    min-width: 160px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }

  .dow {
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
    padding-bottom: 5px;
  }

  .cell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-height: 92px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
  }
  .cell.empty { background: transparent; border-color: transparent; }
  .cell.today { border-color: var(--accent); border-width: 2px; }

  .daynum {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .pill {
    font-size: 0.68rem;
    line-height: 1.3;
    padding: 2px 6px;
    border-radius: 3px;
    border-left: 3px solid var(--dot);
    background: var(--canvas-2);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill:hover { background: var(--line); }

  .hidden { display: none !important; }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .lcard {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--dot);
    border-radius: 4px;
    padding: 13px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .lcard:hover { border-color: var(--dot); }

  .lcard-top { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }

  .badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.66rem;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 2px;
    color: var(--surface);
    background: var(--dot);
    text-transform: uppercase;
  }

  .lcard-date {
    font-family: "IBM Plex Mono", monospace;
    color: var(--ink-dim);
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
  }

  .lcard-title {
    font-family: "Oswald", sans-serif;
    font-weight: 600;
    font-size: 1.08rem;
    margin: 3px 0;
  }

  .lcard-loc { color: var(--ink-dim); font-size: 0.84rem; }

  .empty-note { color: var(--ink-dim); padding: 20px 0; text-align: center; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 8, 4, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 5px solid var(--dot);
    border-radius: 6px;
    padding: 26px;
    width: min(480px, 100%);
    max-height: 82vh;
    overflow-y: auto;
    position: relative;
  }

  .modal-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none;
    color: var(--ink-dim);
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
  }

  .modal h2 {
    font-family: "Oswald", sans-serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 12px 0 6px;
    text-wrap: balance;
  }
  .modal .date { font-family: "IBM Plex Mono", monospace; color: var(--ink-dim); font-size: 0.85rem; }
  .modal .loc { color: var(--ink-dim); font-size: 0.9rem; margin: 4px 0 16px; }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 15px;
    border-radius: 3px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 0.88rem;
    text-decoration: none;
  }
  .source-link:hover { filter: brightness(1.08); }

  footer {
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    color: var(--ink-dim);
    font-size: 0.72rem;
    margin-top: 26px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .grid { gap: 2px; }
    .cell { min-height: 92px; padding: 3px 2px; gap: 2px; align-items: stretch; }
    .dow { font-size: 0.6rem; padding-bottom: 3px; }
    .masthead h1 { font-size: 1.4rem; }
    .daynum { font-size: 0.68rem; padding: 0 1px; }
    .pill {
      width: 100%;
      min-height: 20px;
      padding: 3px 4px;
      border-left: none;
      border-radius: 4px;
      background: var(--dot);
      color: #fff;
      font-size: 0.6rem;
      line-height: 1.15;
      font-weight: 600;
      display: flex;
      align-items: center;
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>Fight Calendar JP</h1>
    <div class="sub">UFC / RIZIN / DEEP / ONE Championship</div>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div class="view-toggle">
      <button id="btn-cal" class="active">カレンダー</button>
      <button id="btn-list">興行一覧</button>
    </div>
  </div>

  <section id="view-cal">
    <div class="cal-nav">
      <button id="prev">&lt;</button>
      <h2 id="month-label"></h2>
      <button id="next">&gt;</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="view-list" class="hidden">
    <div class="list" id="list"></div>
  </section>

  <footer id="footer"></footer>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

    { "id": "one-ff174", "org": "one", "title": "ONE Friday Fights 174 & The Inner Circle 34", "date": "2026-10-09", "location": "バンコク, タイ", "sourceUrl": "https://www.onefc.com/events/" },
    { "id": "one-ff175", "org": "one", "title": "ONE Friday Fights 175 & The Inner Circle 35", "date": "2026-10-16", "location": "バンコク, タイ", "sourceUrl": "https://www.onefc.com/events/" },
    { "id": "one-samurai4", "org": "one", "title": "ONE SAMURAI 4", "date": "2026-10-17", "location": "有明アリーナ, 東京, 日本", "sourceUrl": "https://www.onefc.com/events/" },
    { "id": "one-ff176", "org": "one", "title": "ONE Friday Fights 176 & The Inner Circle 36", "date": "2026-10-30", "location": "バンコク, タイ", "sourceUrl": "https://www.onefc.com/events/" },
    { "id": "one-fn49", "org": "one", "title": "ONE Fight Night 49", "date": "2026-11-07", "location": "Lumpinee Stadium, バンコク, タイ", "sourceUrl": "https://en.wikipedia.org/wiki/2026_in_ONE_Championship" }

};

const ORG_VAR = { ufc: "--ufc", rizin: "--rizin", deep: "--deep", one: "--one" };
const active = new Set(DATA.organizations.map(o => o.id));
let month;
let view = "cal";
const $ = s => document.querySelector(s);
const orgOf = id => DATA.organizations.find(o => o.id === id);
const orgColorVar = id => `var(${ORG_VAR[id]})`;

function filtered() {
  return DATA.events.filter(e => active.has(e.org)).sort((a, b) => a.date.localeCompare(b.date));
}

function renderFilters() {
  const el = $("#filters");
  el.innerHTML = "";
  DATA.organizations.forEach(org => {
    const chip = document.createElement("div");
    chip.className = "chip active";
    chip.style.setProperty("--dot", orgColorVar(org.id));
    chip.innerHTML = `<span class="sw"></span>${org.name}`;
    chip.addEventListener("click", () => {
      active.has(org.id) ? active.delete(org.id) : active.add(org.id);
      chip.classList.toggle("active");
      renderCal();
      renderList();
    });
    el.appendChild(chip);
  });
}

function renderCal() {
  const grid = $("#grid");
  grid.innerHTML = "";
  const y = month.getFullYear(), m = month.getMonth();
  $("#month-label").textContent = `${y} / ${String(m + 1).padStart(2, "0")}`;

  ["日","月","火","水","木","金","土"].forEach(d => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  const first = new Date(y, m, 1);
  const offset = first.getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  const byDate = {};
  filtered().forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));

  for (let i = 0; i < offset; i++) {
    const el = document.createElement("div");
    el.className = "cell empty";
    grid.appendChild(el);
  }

  for (let d = 1; d <= days; d++) {
    const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const cell = document.createElement("div");
    cell.className = "cell" + (dateStr === todayStr ? " today" : "");
    const num = document.createElement("div");
    num.className = "daynum";
    num.textContent = d;
    cell.appendChild(num);

    (byDate[dateStr] || []).forEach(ev => {
      const pill = document.createElement("div");
      pill.className = "pill";
      pill.style.setProperty("--dot", orgColorVar(ev.org));
      pill.textContent = ev.title;
      pill.title = ev.title;
      pill.addEventListener("click", () => openModal(ev));
      cell.appendChild(pill);
    });
    grid.appendChild(cell);
  }
}

function renderList() {
  const el = $("#list");
  el.innerHTML = "";
  const evs = filtered();
  if (!evs.length) {
    el.innerHTML = `<div class="empty-note">該当する興行がありません。</div>`;
    return;
  }
  evs.forEach(ev => {
    const org = orgOf(ev.org);
    const card = document.createElement("div");
    card.className = "lcard";
    card.style.setProperty("--dot", orgColorVar(ev.org));
    card.addEventListener("click", () => openModal(ev));
    const dateFmt = new Date(ev.date).toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
    card.innerHTML = `
      <div class="lcard-top">
        <span class="badge">${org.name}</span>
        <span class="lcard-date">${dateFmt}</span>
      </div>
      <div class="lcard-title">${ev.title}</div>
      <div class="lcard-loc">${ev.location}</div>
    `;
    el.appendChild(card);
  });
}

function openModal(ev) {
  const org = orgOf(ev.org);
  const dateFmt = new Date(ev.date).toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
  $("#modal-body").innerHTML = `
    <span class="badge" style="background:${orgColorVar(ev.org)}">${org.name}</span>
    <h2>${ev.title}</h2>
    <div class="date">${dateFmt}</div>
    <div class="loc">${ev.location}</div>
    ${ev.sourceUrl ? `<a class="source-link" href="${ev.sourceUrl}" target="_blank" rel="noopener noreferrer">対戦カード・詳細を見る ↗</a>` : ""}
  `;
  $("#overlay").classList.remove("hidden");
}

function init() {
  const first = filtered().map(e => e.date).sort()[0];
  month = first ? new Date(first) : new Date();
  month.setDate(1);

  renderFilters();
  renderCal();
  renderList();
  $("#footer").textContent = `最終更新: ${DATA.lastUpdated}`;

  $("#prev").addEventListener("click", () => { month.setMonth(month.getMonth() - 1); renderCal(); });
  $("#next").addEventListener("click", () => { month.setMonth(month.getMonth() + 1); renderCal(); });
  $("#btn-cal").addEventListener("click", () => setView("cal"));
  $("#btn-list").addEventListener("click", () => setView("list"));
  $("#modal-close").addEventListener("click", () => $("#overlay").classList.add("hidden"));
  $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") $("#overlay").classList.add("hidden"); });
}

function setView(v) {
  view = v;
  $("#btn-cal").classList.toggle("active", v === "cal");
  $("#btn-list").classList.toggle("active", v === "list");
  $("#view-cal").classList.toggle("hidden", v !== "cal");
  $("#view-list").classList.toggle("hidden", v !== "list");
}

init();
</script>

</body>
</html>
